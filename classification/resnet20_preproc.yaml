# Qubee calibration preprocessing config (v0.12, qubee.calibration.make_calib)
# Bakes Resize -> CenterCrop -> Normalize -> SetOrder into the compiled MXQ so
# that at runtime we feed raw uint8 images in NHWC/HWC layout (the model's
# input size is [240, 240, 3]).
Datatype: Image
GetImage:
    to_float32: false
    channel_order: RGB

Pre-Order: [ResizeTorch, CenterCrop, Normalize, SetOrder]
Pre-processing:
    ResizeTorch:
        size: 256
        interpolation: bilinear
    CenterCrop:
        size: [240, 240]
    Normalize:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
        to_float_div255: true
    SetOrder:
        shape: HWC
